<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ALTERE AQUI -->
  <title>Mapeador de portas ↔ IDs</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --button: #374151;
      --button-hover: #1f2937;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* =====================================================
       CABEÇALHO
       ===================================================== */

    header {
      background: #111827;
      color: white;
      padding: 28px 20px 76px;
    }

    .header-content {
      max-width: 1100px;
      margin: 0 auto;
    }

    .back-link {
      display: inline-block;
      color: #d1d5db;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .back-link:hover {
      color: white;
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border: 1px solid #374151;
      border-radius: 999px;
      color: #d1d5db;
      font-size: 12px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.2;
    }

    .subtitle {
      max-width: 780px;
      margin: 12px 0 0;
      color: #9ca3af;
      line-height: 1.6;
      font-size: 15px;
    }

    /* =====================================================
       ÁREA PRINCIPAL
       ===================================================== */

    main {
      max-width: 1100px;
      margin: -44px auto 40px;
      padding: 0 20px;
    }

    /* Painel padrão */

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(17, 24, 39, 0.06);
    }

    .panel-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    /* =====================================================
       CAMPOS
       ===================================================== */

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      padding: 12px 14px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #9ca3af;
      box-shadow: 0 0 0 3px rgba(156, 163, 175, 0.18);
    }

    textarea {
      min-height: 150px;
      resize: vertical;
      line-height: 1.5;
    }

    /* Para dados técnicos, hexadecimal, JSON, Modbus etc. */

    .code-input,
    .code-output {
      font-family: Consolas, "Courier New", monospace;
      font-size: 14px;
    }

    /* =====================================================
       GRID
       ===================================================== */

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    /* =====================================================
       BOTÕES
       ===================================================== */

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      border: 0;
      border-radius: 10px;
      background: var(--button);
      color: white;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: var(--button-hover);
    }

    button:active {
      transform: translateY(1px);
    }

    /* =====================================================
       RESULTADO
       ===================================================== */

    .output {
      width: 100%;
      min-height: 180px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #f9fafb;
      font-family: Consolas, "Courier New", monospace;
      font-size: 14px;
      white-space: pre-wrap;
      overflow: auto;
    }

    /* =====================================================
       MENSAGENS
       ===================================================== */

    .status {
      margin-top: 14px;
      font-size: 14px;
      font-weight: bold;
    }

    .error {
      color: #dc2626;
    }

    .success {
      color: #16a34a;
    }

    .info {
      color: var(--muted);
      font-size: 13px;
    }

    /* =====================================================
       RODAPÉ
       ===================================================== */

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 10px 20px 30px;
    }

    /* =====================================================
       RESPONSIVIDADE
       ===================================================== */

    @media (max-width: 700px) {

      header {
        padding: 22px 16px 68px;
      }

      h1 {
        font-size: 28px;
      }

      main {
        padding: 0 16px;
      }

      .panel {
        padding: 18px;
      }

      .grid,
      .grid-3 {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .actions {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       CABEÇALHO
       ===================================================== -->

  <header>

    <div class="header-content">

      <!-- Caminho relativo para voltar à página principal -->
      <a class="back-link" href="../../">
        ← Voltar para ferramentas
      </a>

      <!-- ALTERE AQUI -->
      <div class="badge">
        Gerardor de dados
      </div>

      <!-- ALTERE AQUI -->
      <h1>
        Mapeador de portas ↔ IDs
      </h1>

      <!-- ALTERE AQUI -->
      <p class="subtitle">
        Mapear IDs especificos associados a portas TCP.

      </p>

    </div>

  </header>


  <!-- =====================================================
       CONTEÚDO DA FERRAMENTA

       É PRINCIPALMENTE AQUI QUE CADA NOVA FERRAMENTA
       DEVE SER ADAPTADA.
       ===================================================== -->

  <main>


    <!-- ===================================================
         EXEMPLO DE PAINEL
         =================================================== -->

    <section class="panel">

      <div class="panel-title">
        Mapeador de portas para IDs
      </div>

        <label for="input">Texto com IDs (cole aqui)</label>
        <textarea id="input" placeholder="Cole aqui o texto..." spellcheck="false"></textarea>

        <div class="row">
          <label for="startPort">Porta inicial:</label>
          <input id="startPort" type="number" value="6000" min="1" />
        </div>
        <br>
        <section class="grid">
          <label>Remover duplicados</label>
          <input id="dedupe" type="checkbox" checked />
        </section>
        <br>
        <section class="grid">
          <label>Procurar por prefixo + 4 hex (ex.: <code>0000AA17</code>)</label>
          <input id="searchWithPrefix" type="checkbox" checked />
        </section>
        <br>
        <section class="grid">
          <label for="searchPrefix">Prefixo de busca:</label>
          <input id="searchPrefix" type="text" value="0000" maxlength="4" />
        </section>

        <div class="controls">
          <button id="parseBtn">Gerar mapeamento</button>
          <button id="cleanSpacesBtn">Limpar espaços do texto</button> 
          
        </div>
      

    </section>


    <!-- ===================================================
         EXEMPLO DE RESULTADO
         =================================================== -->

    <section class="panel">

      <div class="panel-title">
        Saída:
      </div>

        <div class="output">
          <pre id="output" aria-live="polite"></pre>
        </div>
        <br>
        <button id="downloadBtn">Baixar portas.txt</button>
        <button id="copyBtn">Copiar saída</button>
    </section>


  </main>


  <!-- =====================================================
       RODAPÉ
       ===================================================== -->

  <footer>
    Ferramentas pessoais · GitHub Pages
  </footer>



  <script>

    function escapeRegex(s){
      return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function extractIds(text, opts){
      if(!text) return [];
      const searchWithPrefix = !!opts.searchWithPrefix;
      const prefix = (opts.prefix || '').toUpperCase();

      const found = [];

      if(searchWithPrefix && prefix){
        const rx = new RegExp('\\b' + escapeRegex(prefix) + '[0-9A-Fa-f]{4}\\b','g');
        let m;
        while((m = rx.exec(text)) !== null){
          const token = m[0].toUpperCase();
          const idPart = token.slice(prefix.length);
          found.push({raw: token, idPart});
        }
      } else {
        const rx4 = /\b[0-9A-Fa-f]{4}\b/g;
        let m;
        while((m = rx4.exec(text)) !== null){
          const token = m[0].toUpperCase();
          found.push({raw: token, idPart: token});
        }
      }

      return found.map(o => o.idPart.toUpperCase());
    }

    function uniquePreserveOrder(arr){
      const seen = new Set();
      const out = [];
      for(const v of arr){
        if(!seen.has(v)){
          seen.add(v);
          out.push(v);
        }
      }
      return out;
    }

    function generateMapping(ids, startPort, outputPrefix){
      const lines = [];
      let p = Number(startPort) || 0;
      for(const id of ids){
        const outId = outputPrefix.toUpperCase() + id.toUpperCase();
        lines.push(p + "=" + outId);
        p++;
      }
      return lines.join('\n') + '\n#';
    }

    function formatAndShow(){
      const text = document.getElementById('input').value;
      const startPort = parseInt(document.getElementById('startPort').value,10) || 0;
      const dedupe = document.getElementById('dedupe').checked;
      const searchWithPrefix = document.getElementById('searchWithPrefix').checked;
      const searchPrefix = document.getElementById('searchPrefix').value || '';

      const addOutputPrefix = true;
      const outputPrefix = "0000";
      const accept4hex = true;

      if(!text.trim()){
        document.getElementById('output').textContent = '';
        return;
      }

      const ids = extractIds(text, {searchWithPrefix, prefix: searchPrefix, accept4: accept4hex});
      let finalIds = ids;
      if(dedupe) finalIds = uniquePreserveOrder(ids);

      const out = generateMapping(finalIds, startPort, outputPrefix, addOutputPrefix);
      document.getElementById('output').textContent = out;
    }

    // --- ALTERAÇÃO AQUI ---
    document.getElementById('cleanSpacesBtn').addEventListener('click', () => {
      const inputEl = document.getElementById('input');
      
      // O padrão /[ \t]+/g remove apenas espaços normais e tabulações (ignora \n e \r)
      let cleanedText = inputEl.value.replace(/[ \t]+/g, '');
      
      inputEl.value = cleanedText;
    });

    document.getElementById('parseBtn').addEventListener('click', formatAndShow);

    document.getElementById('copyBtn').addEventListener('click', ()=>{
      const out = document.getElementById('output').textContent;
      if(!out) return alert('Saída vazia');
      navigator.clipboard.writeText(out).then(()=>{
        alert('Copiado para a área de transferência');
      }, ()=>alert('Falha ao copiar'));
    });

    document.getElementById('downloadBtn').addEventListener('click', ()=>{
      const out = document.getElementById('output').textContent;
      if(!out) return alert('Saída vazia');
      const blob = new Blob([out],{type:'text/plain'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'portas.txt';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });

  </script>

</body>
</html>
